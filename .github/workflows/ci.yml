name: CI

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [debug, release, shared]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan --output-on-failure

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage --output-on-failure

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: static
            preset: release
            config: Release
          - os: ubuntu-latest
            library: shared
            preset: shared
            config: Debug
          - os: windows-latest
            library: static
            preset: release
            config: Release
          - os: windows-latest
            library: shared
            preset: shared
            config: Debug
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure package build
        run: cmake --preset ${{ matrix.preset }}

      - name: Build package
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install package
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.config }} --prefix install

      - name: Configure package smoke project
        run: >
          cmake
          -S tests/package_smoke
          -B build/package-smoke-${{ matrix.library }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build package smoke project
        run: cmake --build build/package-smoke-${{ matrix.library }} --config ${{ matrix.config }}

      - name: Test package smoke project
        run: >
          ctest
          --test-dir build/package-smoke-${{ matrix.library }}
          -C ${{ matrix.config }}
          --output-on-failure

  subproject-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure subproject smoke
        run: >
          cmake
          -S tests/subproject_smoke
          -B build/subproject-smoke
          -DCPROJECT_SOURCE_DIR=${{ github.workspace }}

      - name: Build subproject smoke
        run: cmake --build build/subproject-smoke --config Debug

      - name: Test subproject smoke
        run: ctest --test-dir build/subproject-smoke -C Debug --output-on-failure
