name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Build + package on each platform
  # -----------------------------------------------------------------------
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 6.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev

      - name: Configure (release)
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package (Windows — MSI)
        if: runner.os == 'Windows'
        run: cmake --build --preset ninja-release --target msi

      - name: Package (Linux/macOS — CPack)
        if: runner.os != 'Windows'
        working-directory: build/ninja-release
        run: cpack

      - name: Collect package artifacts
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          # CPack artifacts (Linux/macOS)
          for f in build/ninja-release/CProjectStandard-*; do
            [ -f "$f" ] && cp "$f" dist/
          done
          # MSI artifact (Windows)
          if [ -d build/ninja-release/msi ]; then
            cp build/ninja-release/msi/CProjectStandard-*.msi dist/ 2>/dev/null || true
          fi
          shopt -u nullglob
          # Generate SHA256 checksums
          cd dist && sha256sum -- * > SHA256SUMS 2>/dev/null || true
          cd "$OLDPWD"
          ls dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # Source packages (via git archive — excludes .git, respects .gitattributes)
  # -----------------------------------------------------------------------
  source-package:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source archives
        run: |
          mkdir -p dist
          PREFIX="CProjectStandard-${GITHUB_REF_NAME#v}"
          git archive --prefix="${PREFIX}/" --format=tar.gz \
            -o "dist/${PREFIX}.tar.gz" HEAD
          git archive --prefix="${PREFIX}/" --format=zip \
            -o "dist/${PREFIX}.zip" HEAD

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-source
          path: dist/*
          if-no-files-found: warn

  # -----------------------------------------------------------------------
  # Create GitHub Release
  # -----------------------------------------------------------------------
  release:
    name: Create Release
    needs: [package, source-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          {
            echo "## ${TAG_NAME}"
            echo
            echo "### Install"
            echo
            echo "| Platform | Package |"
            echo "| --- | --- |"
            echo "| Linux   | \`.deb\` / \`.rpm\` / \`.tar.gz\` |"
            echo "| macOS   | \`.pkg\` / \`.tar.gz\` |"
            echo "| Windows | \`.msi\` (Windows Installer) / \`.zip\` |"
            echo
            echo "### Changes"
            echo
          } > release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..HEAD" >> release-notes.md
          else
            git log --pretty=format:'- %s' >> release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
