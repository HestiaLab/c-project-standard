name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # -----------------------------------------------------------------------
  # Build + package on each platform
  # -----------------------------------------------------------------------
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 6.0.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev

      - name: Configure (release)
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package (Windows — MSI)
        if: runner.os == 'Windows'
        run: cmake --build --preset ninja-release --target msi

      - name: Package (Linux/macOS — CPack)
        if: runner.os != 'Windows'
        working-directory: build/ninja-release
        run: cpack

      - name: Collect package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # CPack artifacts (Linux/macOS) or MSI artifact (Windows).
          # Missing artifacts are a hard failure: an incomplete release must
          # never be published silently.
          collected=0
          for f in build/ninja-release/CProjectStandard-*; do
            [ -f "$f" ] && { cp "$f" dist/; collected=$((collected + 1)); }
          done
          if [ -d build/ninja-release/msi ]; then
            for f in build/ninja-release/msi/CProjectStandard-*.msi; do
              [ -f "$f" ] && { cp "$f" dist/; collected=$((collected + 1)); }
            done
          fi
          shopt -u nullglob
          if [ "$collected" -eq 0 ]; then
            echo "ERROR: no package artifacts found under build/ninja-release/ (expected CProjectStandard-* or msi/CProjectStandard-*.msi)" >&2
            ls -R build/ninja-release || true
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Source packages (via git archive — excludes .git, respects .gitattributes)
  # -----------------------------------------------------------------------
  source-package:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create source archives
        run: |
          set -euo pipefail
          mkdir -p dist
          PREFIX="CProjectStandard-${RELEASE_TAG#v}"
          git archive --prefix="${PREFIX}/" --format=tar.gz \
            -o "dist/${PREFIX}.tar.gz" HEAD
          git archive --prefix="${PREFIX}/" --format=zip \
            -o "dist/${PREFIX}.zip" HEAD

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-source
          path: dist/*
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Create GitHub Release
  # -----------------------------------------------------------------------
  release:
    name: Create Release
    needs: [package, source-package]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: release_notes
        run: |
          TAG_NAME="${RELEASE_TAG}"
          {
            echo "## ${TAG_NAME}"
            echo
            echo "### Install"
            echo
            echo "| Platform | Package |"
            echo "| --- | --- |"
            echo "| Linux   | \`.deb\` / \`.rpm\` / \`.tar.gz\` |"
            echo "| macOS   | \`.pkg\` / \`.tar.gz\` |"
            echo "| Windows | \`.msi\` (Windows Installer) / \`.zip\` |"
            echo
            echo "### Changes"
            echo
          } > release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..HEAD" >> release-notes.md
          else
            git log --pretty=format:'- %s' >> release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
